<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DhandhaVerse - Tycoon Inventory</title>
    <!-- Tailwind CSS for Professional UI/UX -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #090d16;
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="flex flex-col h-screen justify-between overflow-hidden">

    <!-- TOP HEADER -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex justify-between items-center z-50">
        <div class="flex items-center space-x-2">
            <a href="index.html" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
            </a>
            <h1 class="text-sm font-bold tracking-tight text-white">Aapka Saaman (Inventory)</h1>
        </div>
        <div class="bg-slate-800 border border-slate-700 px-3 py-1 rounded-xl flex items-center space-x-1.5">
            <i data-lucide="backpack" class="w-3.5 h-3.5 text-amber-400"></i>
            <span class="text-xs font-bold text-amber-400">2 Items Active</span>
        </div>
    </header>

    <!-- MAIN CONTENT: INVENTORY GRID -->
    <main class="flex-1 overflow-y-auto p-4 space-y-4">
        
        <!-- SECTION TITLE -->
        <div>
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Kharide hue aur Designed Assets</h2>
            <p class="text-[10px] text-slate-500">Inhe equip karke game me open-world me ghumo ya resale karo!</p>
        </div>

        <!-- INVENTORY ITEMS GRID -->
        <div class="grid grid-cols-2 gap-3 pb-6">
            
            <!-- INVENTORY ITEM 1 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex flex-col justify-between space-y-3">
                <div class="bg-slate-950 h-28 rounded-xl flex items-center justify-center relative overflow-hidden">
                    <span class="text-3xl">🛺</span>
                    <span class="absolute top-2 right-2 bg-emerald-500/20 text-emerald-400 text-[9px] font-bold px-1.5 py-0.5 rounded border border-emerald-500/30">Equipped</span>
                </div>
                <div>
                    <h3 class="text-xs font-bold text-white truncate">Satara Gold Auto Skin</h3>
                    <p class="text-[10px] text-slate-400">Ready for Game Use</p>
                </div>
                <div class="flex space-x-2 pt-1 border-t border-slate-800/80">
                    <button onclick="itemAction('Equipped')" class="flex-1 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-xl shadow-md">
                        Equipped
                    </button>
                    <button onclick="itemAction('Resale')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-xl border border-slate-700" title="Resale on Marketplace">
                        <i data-lucide="repeat" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>

            <!-- INVENTORY ITEM 2 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex flex-col justify-between space-y-3">
                <div class="bg-slate-950 h-28 rounded-xl flex items-center justify-center relative overflow-hidden">
                    <span class="text-3xl">🍔</span>
                    <span class="absolute top-2 right-2 bg-slate-800 text-slate-300 text-[9px] font-bold px-1.5 py-0.5 rounded border border-slate-700">In Bag</span>
                </div>
                <div>
                    <h3 class="text-xs font-bold text-white truncate">Bhaiya Vada Pav Emote</h3>
                    <p class="text-[10px] text-slate-400">Custom Creator Asset</p>
                </div>
                <div class="flex space-x-2 pt-1 border-t border-slate-800/80">
                    <button onclick="itemAction('Equipped')" class="flex-1 py-1.5 bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-white font-bold text-xs rounded-xl border border-slate-700 transition">
                        Equip Karo
                    </button>
                    <button onclick="itemAction('Resale')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-xl border border-slate-700" title="Resale on Marketplace">
                        <i data-lucide="repeat" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>

        </div>

    </main>

    <!-- NAVIGATION BAR -->
    <nav class="bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-4 py-2 flex justify-around items-center z-50">
        <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-white transition">
            <i data-lucide="compass" class="w-5 h-5 mb-0.5"></i>
            <span class="text-[10px] font-medium">Explore</span>
        </a>
        <a href="marketplace.html" class="flex flex-col items-center text-slate-400 hover:text-white transition">
            <i data-lucide="store" class="w-5 h-5 mb-0.5"></i>
            <span class="text-[10px] font-medium">Market (70%)</span>
        </a>
        <a href="inventory.html" class="flex flex-col items-center text-amber-400 transition">
            <i data-lucide="backpack" class="w-5 h-5 mb-0.5"></i>
            <span class="text-[10px] font-medium">Inventory</span>
        </a>
        <a href="wallet.html" class="flex flex-col items-center text-slate-400 hover:text-white transition">
            <i data-lucide="wallet" class="w-5 h-5 mb-0.5"></i>
            <span class="text-[10px] font-medium">Wallet/UPI</span>
        </a>
    </nav>

    <!-- SCRIPTS -->
    <script>
        lucide.createIcons();

        function itemAction(actionType) {
            if(actionType === 'Resale') {
                alert("Aap yeh item dobara Marketplace par resale ke liye dal sakte hain (Creator aur aapko fir se commission milega)!");
            } else {
                alert("Item successfully equip kar liya gaya hai!");
            }
        }
    </script>
</body>
</html>
