<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wallet - DhandhaVerse</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>body{background:#090d16;color:#fff;font-family:'Inter',system-ui,sans-serif;user-select:none}</style>
</head>
<body class="flex flex-col h-screen justify-between overflow-hidden">
<header class="bg-slate-900/90 border-b border-slate-800 px-4 py-3 flex justify-between items-center">
  <div class="flex items-center space-x-2">
    <a href="index.html" class="p-2 rounded-xl bg-slate-800 text-slate-300"><i data-lucide="arrow-left" class="w-4 h-4"></i></a>
    <h1 class="text-sm font-bold">Tycoon Wallet</h1>
  </div>
  <div class="bg-emerald-500/10 border border-emerald-500/30 px-3 py-1 rounded-xl flex items-center space-x-1.5">
    <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-400"></i>
    <span class="text-xs font-bold text-emerald-400">Secure UPI</span>
  </div>
</header>
<main class="flex-1 overflow-y-auto p-4 space-y-4">
  <div class="grid grid-cols-2 gap-3">
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-2">
      <div class="flex items-center justify-between text-amber-400"><span class="text-[10px] font-bold uppercase">Virtual</span><i data-lucide="sparkles" class="w-4 h-4"></i></div>
      <div class="text-xl font-extrabold" id="vb">₹0.00</div>
      <p class="text-[9px] text-slate-400">Non-withdrawable</p>
    </div>
    <div class="bg-slate-900 border border-emerald-500/30 p-4 rounded-2xl space-y-2">
      <div class="flex items-center justify-between text-emerald-400"><span class="text-[10px] font-bold uppercase">Winning</span><i data-lucide="indian-rupee" class="w-4 h-4"></i></div>
      <div class="text-xl font-extrabold text-emerald-400" id="wb">₹0.00</div>
      <p class="text-[9px] text-slate-300">UPI transfer</p>
    </div>
  </div>

  <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
    <div class="flex items-center space-x-2">
      <div class="p-2 bg-emerald-500/10 text-emerald-400 rounded-xl"><i data-lucide="send" class="w-4 h-4"></i></div>
      <div><h2 class="text-xs font-bold">UPI Par Paisa Bhejo</h2>
      <p class="text-[10px] text-slate-400">Min ₹50 | Instant Transfer</p></div>
    </div>
    <input type="text" id="upi-input" placeholder="apnaname@ybl" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white placeholder-slate-600">
    <input type="number" id="withdraw-amount" placeholder="Amount (₹)" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white placeholder-slate-600">
    <button onclick="requestWithdrawal()" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-xs rounded-xl flex items-center justify-center space-x-2">
      <i data-lucide="check-circle-2" class="w-4 h-4"></i><span>Withdraw Karo</span>
    </button>
  </div>

  <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
    <h3 class="text-xs font-bold mb-3">Recent Transactions</h3>
    <div id="tx-list" class="space-y-2"></div>
  </div>
</main>
<nav class="bg-slate-900/95 border-t border-slate-800 px-4 py-2 flex justify-around">
  <button onclick="location.href='index.html'" class="flex flex-col items-center text-slate-400"><i data-lucide="compass" class="w-5 h-5"></i><span class="text-[10px]">Explore</span></button>
  <button onclick="location.href='marketplace.html'" class="flex flex-col items-center text-slate-400"><i data-lucide="store" class="w-5 h-5"></i><span class="text-[10px]">Market</span></button>
  <button onclick="location.href='inventory.html'" class="flex flex-col items-center text-slate-400"><i data-lucide="backpack" class="w-5 h-5"></i><span class="text-[10px]">Inventory</span></button>
  <button class="flex flex-col items-center text-emerald-400"><i data-lucide="wallet" class="w-5 h-5"></i><span class="text-[10px]">Wallet</span></button>
</nav>
<script src="app.js"></script>
<script>
lucide.createIcons();
async function loadWallet() {
  if (!token()) return location.href = 'index.html';
  const data = await apiFetch('/api/me');
  if (data.user) {
    document.getElementById('vb').innerText = '₹' + Number(data.user.virtual_credit).toFixed(2);
    document.getElementById('wb').innerText = '₹' + Number(data.user.winning_balance).toFixed(2);
  }
  const tx = await apiFetch('/api/wallet/transactions');
  const list = document.getElementById('tx-list');
  if (!tx.transactions || tx.transactions.length === 0) {
    list.innerHTML = `<p class="text-[10px] text-slate-500 text-center py-3">Abhi koi transaction nahi</p>`;
    return;
  }
  list.innerHTML = tx.transactions.map(t => `
    <div class="flex justify-between items-center py-2 border-b border-slate-800/60 last:border-0">
      <div><div class="text-xs font-medium capitalize">${t.type}</div>
      <div class="text-[9px] text-slate-500">${new Date(t.created_at).toLocaleString()}</div></div>
      <div class="text-xs font-bold ${t.amount < 0 ? 'text-red-400' : 'text-emerald-400'}">${t.amount < 0 ? '' : '+'}₹${Math.abs(t.amount).toFixed(2)}</div>
    </div>`).join('');
}
async function requestWithdrawal() {
  const upiId = document.getElementById('upi-input').value.trim();
  const amount = Number(document.getElementById('withdraw-amount').value);
  if (!upiId) return toast('UPI ID likho!', 'error');
  if (!amount || amount < 50) return toast('Min ₹50!', 'error');
  const data = await apiFetch('/api/wallet/withdraw', { method: 'POST', body: JSON.stringify({ upiId, amount }) });
  if (data.error) return toast(data.error, 'error');
  toast(data.message);
  loadWallet();
}
loadWallet();
</script>
</body>
</html>
