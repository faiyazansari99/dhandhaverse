<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Inventory - DhandhaVerse</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>body{background:#090d16;color:#fff;font-family:'Inter',system-ui,sans-serif;user-select:none}</style>
</head>
<body class="flex flex-col h-screen justify-between overflow-hidden">
<header class="bg-slate-900/90 border-b border-slate-800 px-4 py-3 flex justify-between items-center">
  <div class="flex items-center space-x-2">
    <a href="index.html" class="p-2 rounded-xl bg-slate-800 text-slate-300"><i data-lucide="arrow-left" class="w-4 h-4"></i></a>
    <h1 class="text-sm font-bold">Aapka Inventory</h1>
  </div>
</header>
<main class="flex-1 overflow-y-auto p-4">
  <div id="inv-grid" class="grid grid-cols-2 gap-3 pb-6"></div>
</main>
<nav class="bg-slate-900/95 border-t border-slate-800 px-4 py-2 flex justify-around">
  <button onclick="location.href='index.html'" class="flex flex-col items-center text-slate-400"><i data-lucide="compass" class="w-5 h-5"></i><span class="text-[10px]">Explore</span></button>
  <button onclick="location.href='marketplace.html'" class="flex flex-col items-center text-slate-400"><i data-lucide="store" class="w-5 h-5"></i><span class="text-[10px]">Market</span></button>
  <button class="flex flex-col items-center text-amber-400"><i data-lucide="backpack" class="w-5 h-5"></i><span class="text-[10px]">Inventory</span></button>
  <button onclick="location.href='wallet.html'" class="flex flex-col items-center text-slate-400"><i data-lucide="wallet" class="w-5 h-5"></i><span class="text-[10px]">Wallet</span></button>
</nav>
<script src="app.js"></script>
<script>
lucide.createIcons();
async function loadInventory() {
  if (!token()) return location.href = 'index.html';
  const data = await apiFetch('/api/inventory');
  const grid = document.getElementById('inv-grid');
  const inv = data.inventory || [];
  if (inv.length === 0) {
    grid.innerHTML = `<div class="col-span-2 text-center py-10 text-slate-500 text-xs">Inventory khali hai. Marketplace se kharido!</div>`;
    return;
  }
  grid.innerHTML = inv.map(row => {
    const item = row.marketplace_items;
    if (!item) return '';
    return `
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 space-y-3">
        <div class="bg-slate-950 h-28 rounded-xl flex items-center justify-center overflow-hidden">
          ${item.image_data ? `<img src="${item.image_data}" class="w-full h-full object-contain">` : `<span class="text-3xl">🎨</span>`}
        </div>
        <div><h3 class="text-xs font-bold truncate">${item.name}</h3>
        <p class="text-[10px] text-slate-400">${row.equipped ? '✅ Equipped' : 'In Bag'}</p></div>
        <button onclick="equipItem('${item.id}')" class="w-full py-1.5 bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-xs font-bold rounded-xl border border-slate-700">Equip Karo</button>
      </div>`;
  }).join('');
}
async function equipItem(itemId) {
  const data = await apiFetch('/api/inventory/equip', { method: 'POST', body: JSON.stringify({ itemId }) });
  if (data.success) { toast('Equipped!'); loadInventory(); }
}
loadInventory();
</script>
</body>
</html>
