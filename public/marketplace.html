<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Marketplace - DhandhaVerse</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>body{background:#090d16;color:#fff;font-family:'Inter',system-ui,sans-serif;user-select:none}</style>
</head>
<body class="flex flex-col h-screen justify-between overflow-hidden">
<header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex justify-between items-center z-50">
  <div class="flex items-center space-x-2">
    <a href="index.html" class="p-2 rounded-xl bg-slate-800 text-slate-300"><i data-lucide="arrow-left" class="w-4 h-4"></i></a>
    <h1 class="text-sm font-bold">UGC Marketplace</h1>
  </div>
  <div class="bg-amber-500/10 border border-amber-500/30 px-3 py-1 rounded-xl flex items-center space-x-1.5">
    <i data-lucide="coins" class="w-3.5 h-3.5 text-amber-400"></i>
    <span class="text-xs font-bold text-amber-400">70% Creator</span>
  </div>
</header>

<main class="flex-1 overflow-y-auto p-4 space-y-4">
  <div class="bg-gradient-to-r from-amber-500/20 to-orange-500/20 border border-amber-500/30 p-4 rounded-2xl flex items-center justify-between">
    <div><h2 class="text-xs font-bold text-amber-400 uppercase">Apna Design Becho</h2>
    <p class="text-[11px] text-slate-300 mt-0.5">Har sale par 70% seedha cash pao!</p></div>
    <button onclick="location.href='builder.html'" class="px-3 py-2 bg-amber-500 text-slate-950 font-bold text-xs rounded-xl flex items-center space-x-1">
      <i data-lucide="plus" class="w-3.5 h-3.5"></i><span>Naya Banao</span>
    </button>
  </div>

  <div class="flex space-x-2 overflow-x-auto pb-1" id="filter-tabs">
    <button onclick="filterItems('all',this)" class="filter-btn px-3 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-xl whitespace-nowrap">Sabhi</button>
    <button onclick="filterItems('skin',this)" class="filter-btn px-3 py-1.5 bg-slate-900 border border-slate-800 text-slate-300 text-xs rounded-xl whitespace-nowrap">Auto Skins</button>
    <button onclick="filterItems('building',this)" class="filter-btn px-3 py-1.5 bg-slate-900 border border-slate-800 text-slate-300 text-xs rounded-xl whitespace-nowrap">Ghar</button>
    <button onclick="filterItems('emote',this)" class="filter-btn px-3 py-1.5 bg-slate-900 border border-slate-800 text-slate-300 text-xs rounded-xl whitespace-nowrap">Emotes</button>
  </div>

  <div id="items-grid" class="grid grid-cols-2 gap-3 pb-6"></div>
</main>

<nav class="bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-4 py-2 flex justify-around items-center z-50">
  <button onclick="location.href='index.html'" class="flex flex-col items-center text-slate-400"><i data-lucide="compass" class="w-5 h-5"></i><span class="text-[10px]">Explore</span></button>
  <button class="flex flex-col items-center text-amber-400"><i data-lucide="store" class="w-5 h-5"></i><span class="text-[10px]">Market</span></button>
  <button onclick="location.href='inventory.html'" class="flex flex-col items-center text-slate-400"><i data-lucide="backpack" class="w-5 h-5"></i><span class="text-[10px]">Inventory</span></button>
  <button onclick="location.href='wallet.html'" class="flex flex-col items-center text-slate-400"><i data-lucide="wallet" class="w-5 h-5"></i><span class="text-[10px]">Wallet</span></button>
</nav>

<script src="app.js"></script>
<script>
lucide.createIcons();
let allItems = [], currentFilter = 'all';

async function loadMarketplace() {
  const data = await apiFetch('/api/marketplace');
  allItems = data.items || [];
  renderItems();
}

function filterItems(cat, el) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.className = 'filter-btn px-3 py-1.5 bg-slate-900 border border-slate-800 text-slate-300 text-xs rounded-xl whitespace-nowrap';
  });
  el.className = 'filter-btn px-3 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-xl whitespace-nowrap';
  renderItems();
}

function renderItems() {
  const grid = document.getElementById('items-grid');
  const filtered = currentFilter === 'all' ? allItems : allItems.filter(i => i.category === currentFilter);
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="col-span-2 text-center py-10 text-slate-500 text-xs">Abhi koi item nahi hai. Pehla item banao!</div>`;
    return;
  }
  grid.innerHTML = filtered.map(item => `
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex flex-col justify-between space-y-3 hover:border-amber-500/50 transition">
      <div class="bg-slate-950 h-28 rounded-xl flex items-center justify-center relative overflow-hidden">
        ${item.image_data ? `<img src="${item.image_data}" class="w-full h-full object-contain">` : `<span class="text-3xl">🎨</span>`}
        <span class="absolute top-2 right-2 bg-slate-900/80 text-[9px] text-emerald-400 font-bold px-1.5 py-0.5 rounded">Verified</span>
      </div>
      <div>
        <h3 class="text-xs font-bold truncate">${item.name}</h3>
        <p class="text-[10px] text-slate-400">By: ${item.creator_username}</p>
      </div>
      <div class="flex items-center justify-between pt-1 border-t border-slate-800/80">
        <div><div class="text-[9px] text-slate-500">Price</div><div class="text-xs font-bold text-amber-400">₹${item.price}</div></div>
        <button onclick="buyItem('${item.id}')" class="px-3 py-1.5 bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-white font-bold text-xs rounded-xl border border-slate-700">Kharido</button>
      </div>
    </div>`).join('');
}

async function buyItem(id) {
  if (!token()) return location.href = 'index.html';
  const data = await apiFetch('/api/marketplace/buy', { method: 'POST', body: JSON.stringify({ itemId: id }) });
  if (data.error) return toast(data.error, 'error');
  toast(data.message);
  loadMarketplace();
}

loadMarketplace();
</script>
</body>
</html>
