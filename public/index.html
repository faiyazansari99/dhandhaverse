<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DhandhaVerse - Khelo, Banao, Kamao</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { background-color: #090d16; color: #fff; font-family: 'Inter', system-ui, sans-serif; user-select: none; }
  .glow-amber { box-shadow: 0 0 30px rgba(245,158,11,0.4); }
  .glow-emerald { box-shadow: 0 0 30px rgba(16,185,129,0.3); }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  .float { animation: float 3s ease-in-out infinite; }
</style>
</head>
<body class="flex flex-col h-screen justify-between overflow-hidden">

<header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-2.5 flex justify-between items-center z-50">
  <div class="flex items-center space-x-3">
    <div class="relative">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center font-bold text-slate-950 shadow-md glow-amber" id="user-avatar-initial">DV</div>
      <div class="absolute -bottom-1 -right-1 bg-emerald-500 w-3.5 h-3.5 rounded-full border-2 border-slate-900"></div>
    </div>
    <div>
      <h1 class="text-sm font-bold" id="display-username">Guest</h1>
      <span class="text-[10px] text-amber-400 font-semibold bg-amber-400/10 px-1.5 py-0.5 rounded">Level 1 Tycoon</span>
    </div>
  </div>
  <div class="flex items-center space-x-3">
    <div class="bg-slate-800/90 border border-slate-700/80 px-3 py-1 rounded-xl flex items-center space-x-3">
      <div><div class="text-[9px] text-amber-400 uppercase">Virtual</div><div class="text-xs font-bold text-amber-300" id="virtual-wallet">₹0</div></div>
      <div class="h-6 w-px bg-slate-700"></div>
      <div><div class="text-[9px] text-emerald-400 uppercase">Winning</div><div class="text-xs font-bold text-emerald-400" id="winning-wallet">₹0</div></div>
    </div>
    <button onclick="logout()" class="p-2 rounded-xl bg-slate-800 border border-slate-700 text-red-400"><i data-lucide="log-out" class="w-4 h-4"></i></button>
  </div>
</header>

<main class="flex-1 relative bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 flex flex-col items-center justify-center overflow-hidden">

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="absolute inset-0 bg-slate-950/95 backdrop-blur-xl z-40 flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-2xl space-y-5">
      <div class="text-center space-y-1">
        <div class="w-14 h-14 bg-amber-500/10 border border-amber-500/20 text-amber-400 rounded-2xl mx-auto flex items-center justify-center mb-3 float">
          <i data-lucide="gamepad-2" class="w-7 h-7"></i>
        </div>
        <h2 class="text-2xl font-extrabold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">DhandhaVerse</h2>
        <p class="text-xs text-slate-400">Khelo, Banao, Becho aur Real Cash Kamao</p>
      </div>
      <div id="auth-tabs" class="flex bg-slate-950 rounded-xl p-1 border border-slate-800">
        <button id="tab-login" onclick="switchAuth('login')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-amber-500 text-slate-950">Login</button>
        <button id="tab-register" onclick="switchAuth('register')" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-400">Register</button>
      </div>
      <div class="space-y-3">
        <div class="relative">
          <i data-lucide="user" class="absolute left-3 top-3.5 w-4 h-4 text-slate-500"></i>
          <input type="text" id="username-input" placeholder="Gamer naam (jaise: SataraKing)" class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm placeholder-slate-600 focus:outline-none focus:border-amber-500">
        </div>
        <div class="relative">
          <i data-lucide="lock" class="absolute left-3 top-3.5 w-4 h-4 text-slate-500"></i>
          <input type="password" id="password-input" placeholder="Password" class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm placeholder-slate-600 focus:outline-none focus:border-amber-500">
        </div>
        <button onclick="handleAuth()" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-bold rounded-xl shadow-lg glow-amber flex items-center justify-center space-x-2 text-sm">
          <span id="auth-btn-text">Game Me Enter Karo (₹10 Bonus)</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </div>
      <p class="text-[10px] text-slate-500 text-center">100% Safe • Skill-Based • UPI Payouts</p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-screen" class="absolute inset-0 flex flex-col justify-between p-4 pointer-events-none">
    <div class="self-end space-y-2 pointer-events-auto">
      <button onclick="location.href='builder.html'" class="flex items-center space-x-2 bg-slate-900/90 backdrop-blur-md border border-slate-700 px-3 py-2 rounded-2xl shadow-lg hover:border-amber-500 transition active:scale-95 group">
        <div class="p-1.5 bg-amber-500/10 text-amber-400 rounded-xl group-hover:bg-amber-500 group-hover:text-slate-950 transition"><i data-lucide="hammer" class="w-4 h-4"></i></div>
        <div class="text-left pr-1"><div class="text-xs font-bold">Gully Builder</div><div class="text-[9px] text-slate-400">Skin/Asset Design</div></div>
      </button>
      <button onclick="startNaukri()" class="flex items-center space-x-2 bg-slate-900/90 backdrop-blur-md border border-slate-700 px-3 py-2 rounded-2xl shadow-lg hover:border-blue-500 transition active:scale-95 group">
        <div class="p-1.5 bg-blue-500/10 text-blue-400 rounded-xl group-hover:bg-blue-500 group-hover:text-slate-950 transition"><i data-lucide="shield-check" class="w-4 h-4"></i></div>
        <div class="text-left pr-1"><div class="text-xs font-bold">Sarkari Naukri</div><div class="text-[9px] text-slate-400">Daily ₹200 Salary</div></div>
      </button>
      <button onclick="location.href='game.html'" class="flex items-center space-x-2 bg-slate-900/90 backdrop-blur-md border border-slate-700 px-3 py-2 rounded-2xl shadow-lg hover:border-emerald-500 transition active:scale-95 group">
        <div class="p-1.5 bg-emerald-500/10 text-emerald-400 rounded-xl group-hover:bg-emerald-500 group-hover:text-slate-950 transition"><i data-lucide="globe" class="w-4 h-4"></i></div>
        <div class="text-left pr-1"><div class="text-xs font-bold">Open World</div><div class="text-[9px] text-slate-400">Khelo & Explore</div></div>
      </button>
    </div>

    <div class="self-center text-center pointer-events-auto bg-slate-900/80 backdrop-blur-md border border-slate-800 px-4 py-2 rounded-2xl">
      <p class="text-xs font-medium text-amber-400">🌍 Open World Server Active: India Network</p>
    </div>

    <div class="self-center pointer-events-auto pb-2">
      <button onclick="location.href='game.html'" class="px-8 py-4 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-extrabold rounded-2xl shadow-xl glow-amber flex items-center space-x-2 active:scale-95 transition">
        <i data-lucide="play" class="w-5 h-5 fill-slate-950"></i>
        <span>Khelna Shuru Karo</span>
      </button>
    </div>
  </div>
</main>

<nav class="bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-4 py-2 flex justify-around items-center z-50">
  <button onclick="location.href='index.html'" class="flex flex-col items-center text-amber-400"><i data-lucide="compass" class="w-5 h-5 mb-0.5"></i><span class="text-[10px]">Explore</span></button>
  <button onclick="location.href='marketplace.html'" class="flex flex-col items-center text-slate-400"><i data-lucide="store" class="w-5 h-5 mb-0.5"></i><span class="text-[10px]">Market 70%</span></button>
  <button onclick="location.href='inventory.html'" class="flex flex-col items-center text-slate-400"><i data-lucide="backpack" class="w-5 h-5 mb-0.5"></i><span class="text-[10px]">Inventory</span></button>
  <button onclick="location.href='wallet.html'" class="flex flex-col items-center text-slate-400"><i data-lucide="wallet" class="w-5 h-5 mb-0.5"></i><span class="text-[10px]">Wallet</span></button>
</nav>

<script src="app.js"></script>
<script>
  lucide.createIcons();
  let authMode = 'login';
  function switchAuth(mode) {
    authMode = mode;
    document.getElementById('tab-login').className = mode==='login' ? 'flex-1 py-2 text-xs font-bold rounded-lg bg-amber-500 text-slate-950' : 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-400';
    document.getElementById('tab-register').className = mode==='register' ? 'flex-1 py-2 text-xs font-bold rounded-lg bg-amber-500 text-slate-950' : 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-400';
    document.getElementById('auth-btn-text').innerText = mode==='login' ? 'Login Karo' : 'Register Karo (₹10 Bonus)';
  }
</script>
</body>
</html>
