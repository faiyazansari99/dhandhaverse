<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gully Builder - DhandhaVerse</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>body{background:#090d16;color:#fff;font-family:'Inter',system-ui,sans-serif;user-select:none}</style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
<header class="bg-slate-900/90 border-b border-slate-800 px-4 py-3 flex justify-between items-center">
  <div class="flex items-center space-x-2">
    <a href="marketplace.html" class="p-2 rounded-xl bg-slate-800 text-slate-300"><i data-lucide="arrow-left" class="w-4 h-4"></i></a>
    <h1 class="text-sm font-bold">Gully Builder Studio</h1>
  </div>
</header>
<main class="flex-1 overflow-y-auto p-4 space-y-4">
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
    <p class="text-[11px] text-slate-400">Canvas par click karke apna design banao. Color choose karo aur paint karo!</p>
    <div class="flex justify-center">
      <canvas id="design-canvas" width="300" height="300" class="bg-slate-950 rounded-2xl border-2 border-slate-800 touch-none"></canvas>
    </div>
    <div class="flex items-center space-x-3">
      <label class="text-xs text-slate-400">Color:</label>
      <input type="color" id="brush-color" value="#f59e0b" class="w-10 h-10 rounded-lg bg-slate-950 border border-slate-800">
      <label class="text-xs text-slate-400">Size:</label>
      <input type="range" id="brush-size" min="5" max="40" value="15" class="flex-1">
      <button onclick="clearCanvas()" class="px-3 py-2 bg-red-500/20 text-red-400 text-xs font-bold rounded-xl border border-red-500/30">Clear</button>
    </div>
  </div>

  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
    <input type="text" id="asset-name" placeholder="Item Name (e.g. Neo Rickshaw)" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white placeholder-slate-600">
    <input type="number" id="asset-price" placeholder="Selling Price (₹)" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white placeholder-slate-600">
    <select id="asset-cat" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white">
      <option value="skin">Auto Skin</option>
      <option value="building">Ghar / Building</option>
      <option value="emote">Emote / Clothes</option>
    </select>
    <button onclick="publishAsset()" class="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-bold text-xs rounded-xl">Publish & Earn 70%</button>
  </div>
</main>

<script src="app.js"></script>
<script>
lucide.createIcons();
const canvas = document.getElementById('design-canvas');
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#020617'; ctx.fillRect(0,0,300,300);
let drawing = false;

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  return { x: x * (canvas.width/rect.width), y: y * (canvas.height/rect.height) };
}
function startDraw(e) { e.preventDefault(); drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
function draw(e) {
  if (!drawing) return; e.preventDefault();
  const p = getPos(e);
  ctx.strokeStyle = document.getElementById('brush-color').value;
  ctx.lineWidth = document.getElementById('brush-size').value;
  ctx.lineCap = 'round';
  ctx.lineTo(p.x,p.y); ctx.stroke();
}
function stopDraw() { drawing = false; }

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDraw);
canvas.addEventListener('touchstart', startDraw);
canvas.addEventListener('touchmove', draw);
canvas.addEventListener('touchend', stopDraw);

function clearCanvas() { ctx.fillStyle = '#020617'; ctx.fillRect(0,0,300,300); }

async function publishAsset() {
  const name = document.getElementById('asset-name').value.trim();
  const price = document.getElementById('asset-price').value.trim();
  const category = document.getElementById('asset-cat').value;
  if (!name || !price) return toast('Naam aur price bharo!', 'error');
  if (!token()) return location.href = 'index.html';

  const image_data = canvas.toDataURL('image/png');
  const data = await apiFetch('/api/marketplace/publish', {
    method: 'POST',
    body: JSON.stringify({ name, price: Number(price), category, image_data })
  });
  if (data.error) return toast(data.error, 'error');
  toast('Asset publish ho gaya! 🎉');
  setTimeout(() => location.href = 'marketplace.html', 1200);
}
</script>
</body>
</html>
