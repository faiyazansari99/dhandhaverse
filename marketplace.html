<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DhandhaVerse - UGC Marketplace (70-30 Split)</title>
    <!-- Tailwind CSS for Professional UI/UX -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #090d16;
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="flex flex-col h-screen justify-between overflow-hidden">

    <!-- TOP HEADER -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex justify-between items-center z-50">
        <div class="flex items-center space-x-2">
            <a href="index.html" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
            </a>
            <h1 class="text-sm font-bold tracking-tight text-white">UGC Marketplace</h1>
        </div>
        <div class="bg-amber-500/10 border border-amber-500/30 px-3 py-1 rounded-xl flex items-center space-x-1.5">
            <i data-lucide="coins" class="w-3.5 h-3.5 text-amber-400"></i>
            <span class="text-xs font-bold text-amber-400">70% Creator | 30% Dev</span>
        </div>
    </header>

    <!-- MAIN CONTENT: MARKETPLACE ITEMS GRID -->
    <main class="flex-1 overflow-y-auto p-4 space-y-4">
        
        <!-- BANNER INFO -->
        <div class="bg-gradient-to-r from-amber-500/20 to-orange-500/20 border border-amber-500/30 p-4 rounded-2xl flex items-center justify-between">
            <div>
                <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider">Apna Design Becho</h2>
                <p class="text-[11px] text-slate-300 mt-0.5">Skin banao, publish karo, aur har sale par 70% seedha cash pao!</p>
            </div>
            <button onclick="openBuilderModal()" class="px-3 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs rounded-xl shadow-lg transition active:scale-95 flex items-center space-x-1">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                <span>Naya Item Banao</span>
            </button>
        </div>

        <!-- FILTER TABS -->
        <div class="flex space-x-2 overflow-x-auto pb-1">
            <button class="px-3 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-xl whitespace-nowrap shadow-md">Sabhi Items</button>
            <button class="px-3 py-1.5 bg-slate-900 border border-slate-800 text-slate-300 font-medium text-xs rounded-xl whitespace-nowrap hover:border-slate-700">Auto Skins</button>
            <button class="px-3 py-1.5 bg-slate-900 border border-slate-800 text-slate-300 font-medium text-xs rounded-xl whitespace-nowrap hover:border-slate-700">Ghar & Buildings</button>
            <button class="px-3 py-1.5 bg-slate-900 border border-slate-800 text-slate-300 font-medium text-xs rounded-xl whitespace-nowrap hover:border-slate-700">Emotes & Clothes</button>
        </div>

        <!-- ITEMS GRID -->
        <div class="grid grid-cols-2 gap-3 pb-6">
            
            <!-- ITEM CARD 1 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex flex-col justify-between space-y-3 hover:border-amber-500/50 transition">
                <div class="bg-slate-950 h-28 rounded-xl flex items-center justify-center relative overflow-hidden group">
                    <span class="text-3xl">🛺</span>
                    <span class="absolute top-2 right-2 bg-slate-900/80 backdrop-blur-sm text-[9px] text-emerald-400 font-bold px-1.5 py-0.5 rounded border border-slate-800">Verified</span>
                </div>
                <div>
                    <h3 class="text-xs font-bold text-white truncate">Satara Gold Auto Skin</h3>
                    <p class="text-[10px] text-slate-400">By: Gamer_Satara</p>
                </div>
                <div class="flex items-center justify-between pt-1 border-t border-slate-800/80">
                    <div>
                        <div class="text-[9px] text-slate-500">Price</div>
                        <div class="text-xs font-bold text-amber-400">₹50.00</div>
                    </div>
                    <button onclick="buyItem('Satara Gold Auto Skin', 50)" class="px-3 py-1.5 bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-white font-bold text-xs rounded-xl transition border border-slate-700">
                        Kharido
                    </button>
                </div>
            </div>

            <!-- ITEM CARD 2 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex flex-col justify-between space-y-3 hover:border-amber-500/50 transition">
                <div class="bg-slate-950 h-28 rounded-xl flex items-center justify-center relative overflow-hidden group">
                    <span class="text-3xl">🍔</span>
                    <span class="absolute top-2 right-2 bg-slate-900/80 backdrop-blur-sm text-[9px] text-emerald-400 font-bold px-1.5 py-0.5 rounded border border-slate-800">Verified</span>
                </div>
                <div>
                    <h3 class="text-xs font-bold text-white truncate">Bhaiya Vada Pav Emote</h3>
                    <p class="text-[10px] text-slate-400">By: Creator_Rohit</p>
                </div>
                <div class="flex items-center justify-between pt-1 border-t border-slate-800/80">
                    <div>
                        <div class="text-[9px] text-slate-500">Price</div>
                        <div class="text-xs font-bold text-amber-400">₹20.00</div>
                    </div>
                    <button onclick="buyItem('Bhaiya Vada Pav Emote', 20)" class="px-3 py-1.5 bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-white font-bold text-xs rounded-xl transition border border-slate-700">
                        Kharido
                    </button>
                </div>
            </div>

        </div>

    </main>

    <!-- NAVIGATION BAR -->
    <nav class="bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-4 py-2 flex justify-around items-center z-50">
        <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-white transition">
            <i data-lucide="compass" class="w-5 h-5 mb-0.5"></i>
            <span class="text-[10px] font-medium">Explore</span>
        </a>
        <a href="marketplace.html" class="flex flex-col items-center text-amber-400 transition">
            <i data-lucide="store" class="w-5 h-5 mb-0.5"></i>
            <span class="text-[10px] font-medium">Market (70%)</span>
        </a>
        <a href="inventory.html" class="flex flex-col items-center text-slate-400 hover:text-white transition">
            <i data-lucide="backpack" class="w-5 h-5 mb-0.5"></i>
            <span class="text-[10px] font-medium">Inventory</span>
        </a>
        <a href="wallet.html" class="flex flex-col items-center text-slate-400 hover:text-white transition">
            <i data-lucide="wallet" class="w-5 h-5 mb-0.5"></i>
            <span class="text-[10px] font-medium">Wallet/UPI</span>
        </a>
    </nav>

    <!-- SCRIPTS -->
    <script>
        lucide.createIcons();

        function openBuilderModal() {
            alert("Gully Builder tool khul raha hai! Agle file me iska code milega.");
        }

        function buyItem(itemName, price) {
            alert("Aapne '" + itemName + "' kharid liya hai! (70% creator ko aur 30% dev commission add ho gaya).");
        }
    </script>
</body>
</html>
